<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="page narrow">
        <nav class="top-nav">
            <a href="/">Home</a>
            <a href="/doctors">Doctors</a>
            <a href="/appointments">Appointments</a>
        </nav>

        <h1>Book Appointment</h1>

        <p class="error" th:if="${param.error}">
            This doctor is already booked at this date and time.
        </p>

        <form class="form-panel" action="/book" method="post">
            <label for="patientName">Patient Name</label>
            <input id="patientName" type="text" name="patientName" required placeholder="Example: Alex">

            <label for="doctorName">Doctor</label>
            <select id="doctorName" name="doctorName" required>
                <option th:each="doctor : ${doctors}"
                        th:value="${doctor.name}"
                        th:text="${doctor.name + ' - ' + doctor.specialty}"
                        th:selected="${doctor.name == selectedDoctor}">
                    Doctor
                </option>
            </select>

            <label for="date">Date</label>
            <input id="date" type="date" name="date" required>

            <label for="time">Time</label>
            <input id="time" type="time" name="time" required>

            <button type="submit">Book Appointment</button>
        </form>
    </main>
</body>
</html>
